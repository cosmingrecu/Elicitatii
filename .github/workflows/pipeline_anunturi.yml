name: ANAF Scraper & Extractor Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Rulează zilnic la ora 06:00 UTC
  workflow_dispatch: # Permite rularea manuală din tab-ul Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary beautifulsoup4 lxml requests
          playwright install chromium

      - name: Cache browser profile
        uses: actions/cache@v4
        with:
          path: browser_profile
          key: ${{ runner.os }}-browser-profile-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-browser-profile-

      - name: Run Scraper
        env:
          NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
          NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
        run: |
          python scraper.py

      - name: Run Extractor (Batch processing)
        env:
          NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
          NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
        run: |
          python extractor.py
