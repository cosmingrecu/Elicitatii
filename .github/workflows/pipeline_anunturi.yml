name: Pipeline Anunțuri ANAF

on:
  schedule:
    - cron: '0 6 * * *' # Rulează zilnic la ora 06:00 UTC
  workflow_dispatch: # Permite rularea manuală din tab-ul Actions

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Scraper & Extractor
        env:
          NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
          NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
        run: |
          python scraper.py
          python extractor.py