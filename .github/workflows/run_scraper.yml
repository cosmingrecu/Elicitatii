name: Rulare Automata ANAF (Scraper & Extractor)

on:
  schedule:
    # 14:00 ora României (EET = UTC+2 -> 12:00 UTC; EEST = UTC+3 -> 11:00 UTC).
    # Exemplu setat pentru ora 11:00 UTC (14:00 ora României în perioada de vară / EEST):
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite rularea manuală oricând din tab-ul Actions

jobs:
  actualizare-anaf:
    runs-on: ubuntu-latest

    steps:
    - name: Preia codul din repository
      uses: actions/checkout@v4

    - name: Configurează Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalează dependențele
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 1. Rulează Scraper.py
      env:
        NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
        NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
        NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
        NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
        NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
      run: |
        python scraper.py

    - name: 2. Rulează Extractor.py (după finalizarea cu succes a scraperului)
      env:
        NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
        NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
        NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
        NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
        NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
      run: |
        python extractor.py
